<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">
  <title>מטבח חוץ</title>
  <!-- Outdoor kitchen - top-down view -->
  <!-- Counter base -->
  <rect x="2" y="2" width="76" height="46" rx="3" fill="#78909C" stroke="#546E7A" stroke-width="2"/>
  <!-- Grill area -->
  <rect x="6" y="6" width="28" height="28" rx="2" fill="#424242"/>
  <circle cx="13" cy="13" r="3" fill="#616161"/>
  <circle cx="27" cy="13" r="3" fill="#616161"/>
  <circle cx="13" cy="27" r="3" fill="#616161"/>
  <circle cx="27" cy="27" r="3" fill="#616161"/>
  <!-- Grill grates -->
  <line x1="8" y1="20" x2="32" y2="20" stroke="#757575" stroke-width="1"/>
  <!-- Sink -->
  <rect x="40" y="6" width="18" height="16" rx="2" fill="#90A4AE"/>
  <ellipse cx="49" cy="14" rx="6" ry="5" fill="#B0BEC5"/>
  <circle cx="52" cy="11" r="1.5" fill="#607D8B"/>
  <!-- Prep counter -->
  <rect x="40" y="26" width="34" height="18" rx="2" fill="#ECEFF1"/>
  <!-- Storage doors below (indicated) -->
  <rect x="6" y="38" width="16" height="6" fill="#607D8B" rx="1"/>
  <rect x="24" y="38" width="10" height="6" fill="#607D8B" rx="1"/>
</svg>
