<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <title>מתקן משחק</title>
  <!-- Play equipment - top-down view (swing set / climbing frame) -->
  <!-- Main frame -->
  <rect x="4" y="4" width="72" height="72" fill="none" stroke="#F57C00" stroke-width="4"/>
  <!-- Cross beams -->
  <line x1="4" y1="40" x2="76" y2="40" stroke="#FF9800" stroke-width="3"/>
  <line x1="40" y1="4" x2="40" y2="76" stroke="#FF9800" stroke-width="3"/>
  <!-- Corner posts -->
  <circle cx="4" cy="4" r="4" fill="#E65100"/>
  <circle cx="76" cy="4" r="4" fill="#E65100"/>
  <circle cx="4" cy="76" r="4" fill="#E65100"/>
  <circle cx="76" cy="76" r="4" fill="#E65100"/>
  <!-- Swing seats (top-down) -->
  <rect x="15" y="18" width="12" height="6" fill="#3E2723" rx="1"/>
  <rect x="53" y="18" width="12" height="6" fill="#3E2723" rx="1"/>
  <!-- Slide (top-down) -->
  <rect x="52" y="46" width="8" height="26" fill="#1E88E5" rx="1"/>
  <!-- Climbing area -->
  <circle cx="21" cy="60" r="3" fill="#FFC107"/>
  <circle cx="30" cy="52" r="3" fill="#FFC107"/>
  <circle cx="21" cy="52" r="3" fill="#FFC107"/>
  <circle cx="30" cy="60" r="3" fill="#FFC107"/>
</svg>
