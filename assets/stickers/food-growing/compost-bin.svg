<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <title>פח קומפוסט</title>
  <!-- Compost bin - top-down view -->
  <rect x="4" y="4" width="32" height="32" rx="3" fill="#6D4C41" stroke="#4E342E" stroke-width="2"/>
  <!-- Lid with handle -->
  <rect x="6" y="6" width="28" height="28" rx="2" fill="#5D4037"/>
  <!-- Handle -->
  <rect x="16" y="16" width="8" height="8" rx="1" fill="#8D6E63"/>
  <!-- Ventilation holes -->
  <circle cx="12" cy="12" r="2" fill="#3E2723"/>
  <circle cx="28" cy="12" r="2" fill="#3E2723"/>
  <circle cx="12" cy="28" r="2" fill="#3E2723"/>
  <circle cx="28" cy="28" r="2" fill="#3E2723"/>
</svg>
