<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 50">
  <title>בריכת שכשוך</title>
  <!-- Wading pool - top-down oval view -->
  <!-- Pool border -->
  <ellipse cx="35" cy="25" rx="33" ry="23" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <!-- Water -->
  <ellipse cx="35" cy="25" rx="28" ry="18" fill="#42A5F5"/>
  <!-- Water reflections -->
  <ellipse cx="25" cy="20" rx="8" ry="4" fill="#90CAF9" opacity="0.5"/>
  <ellipse cx="45" cy="30" rx="6" ry="3" fill="#90CAF9" opacity="0.4"/>
  <!-- Pool edge detail -->
  <ellipse cx="35" cy="25" rx="30" ry="20" fill="none" stroke="#64B5F6" stroke-width="1"/>
</svg>
