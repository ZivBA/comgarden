<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60">
  <title>דק עץ</title>
  <!-- Wooden deck - top-down view -->
  <!-- Base -->
  <rect x="2" y="2" width="76" height="56" rx="2" fill="#8D6E63" stroke="#6D4C41" stroke-width="2"/>
  <!-- Wooden planks -->
  <line x1="2" y1="10" x2="78" y2="10" stroke="#795548" stroke-width="1"/>
  <line x1="2" y1="18" x2="78" y2="18" stroke="#795548" stroke-width="1"/>
  <line x1="2" y1="26" x2="78" y2="26" stroke="#795548" stroke-width="1"/>
  <line x1="2" y1="34" x2="78" y2="34" stroke="#795548" stroke-width="1"/>
  <line x1="2" y1="42" x2="78" y2="42" stroke="#795548" stroke-width="1"/>
  <line x1="2" y1="50" x2="78" y2="50" stroke="#795548" stroke-width="1"/>
  <!-- Wood grain details -->
  <ellipse cx="20" cy="14" rx="8" ry="2" fill="#A1887F" opacity="0.3"/>
  <ellipse cx="55" cy="30" rx="10" ry="2" fill="#A1887F" opacity="0.3"/>
  <ellipse cx="35" cy="46" rx="9" ry="2" fill="#A1887F" opacity="0.3"/>
</svg>
